name: GTA VI — atualização automática (ao vivo + catálogo)

# Regenera live/vi-live.json (anúncios, notícias, wiki) e live/vi-catalog.json
# (veículos, armas, personagens, gangues, locais, negócios, animais e rádios de
# GTA VI lidos do GTA Wiki). Se algo mudou, faz commit — a Vercel publica em
# seguida. Também pode ser disparado manualmente na aba Actions.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vi-live
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Atualizar radar ao vivo
        run: node scripts/refresh-vi-live.js
      - name: Atualizar catálogo de GTA VI (GTA Wiki)
        run: node scripts/build-vi-catalog.js
      - name: Commit se houver mudança
        run: |
          git config user.name "gta-dossie-bot"
          git config user.email "actions@users.noreply.github.com"
          git add live/
          if git diff --cached --quiet; then
            echo "Nada mudou."
          else
            git commit -m "live: atualização automática $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
