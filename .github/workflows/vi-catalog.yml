name: GTA VI — catálogo automático (GTA Wiki)

# Regenera live/vi-catalog.json (veículos, armas, personagens, gangues, locais,
# negócios, animais e rádios de GTA VI lidos do GTA Wiki). Se algo mudou, faz
# commit — a Vercel publica em seguida. Também pode ser disparado manualmente
# na aba Actions.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vi-catalog
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Atualizar catálogo de GTA VI (GTA Wiki)
        run: node scripts/build-vi-catalog.js
      - name: Instalar dependências (build + i18n)
        run: npm install --no-audit --no-fund
      - name: Traduzir o conteúdo novo do catálogo
        # O catálogo vem do GTA Wiki em inglês. Extrai os textos novos e traduz
        # só o que ainda não está no cache i18n/parts/<code>.mt.json.
        run: |
          node build.js
          node i18n/extract-content.js
          node i18n/translate.js
      - name: Commit se houver mudança
        run: |
          git config user.name "gta-dossie-bot"
          git config user.email "actions@users.noreply.github.com"
          git add live/ i18n/parts/ i18n/*.content.js
          if git diff --cached --quiet; then
            echo "Nada mudou."
          else
            git commit -m "catálogo: atualização automática $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
